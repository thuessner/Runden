<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runden mit Mini und Max</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --mini:#4fae3a; --mini-l:#e5f7dc; --max:#b9773d; --max-l:#f8ebdc;
  --ink:#24324a; --soft:#5d6b82; --card:#fff; --hr:#ffe066; --hd:#e03131;
  --ok:#2f9e44; --ok-l:#d3f9d8; --bad:#e03131; --bad-l:#ffe3e3; --mid:#fff3bf; --violet:#7048e8;
}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:'Fredoka','Nunito','Avenir Next',system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(160deg,#e7f5ff 0%,#f4fce3 55%,#fff4e6 100%);min-height:100vh;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#app{max-width:1640px;margin:0 auto;padding:14px 18px 30px;transform-origin:0 0}
html.fitmode,html.fitmode body{overflow:hidden;height:100%;min-height:0;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
.tools{display:flex;gap:8px}
.tool{background:#fff;border-radius:14px;min-width:52px;height:46px;padding:0 12px;font-size:19px;font-weight:600;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.playgrid,.learngrid{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
.playgrid .card,.learngrid .card{margin-bottom:0}
@media (min-width:1000px) and (orientation:landscape){
  .playgrid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
  .learngrid{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
}
.imgtool{display:inline-flex;align-items:center;cursor:pointer}
.heroimg{flex-direction:column;gap:8px}
.heroimg img{max-width:100%;max-height:240px;border-radius:20px;box-shadow:0 6px 20px rgba(36,50,74,.15);display:block}
.acard.done .pad{display:none}
.acard.done .check{display:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;-webkit-user-select:none;user-select:none;-webkit-appearance:none;appearance:none;white-space:normal;min-width:0;max-width:100%}
button,.q,.fb,.bubble{overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto}
h1{font-size:clamp(26px,4.5vw,40px);margin:0 0 4px;line-height:1.1}
h2{font-size:22px;margin:0 0 12px}
.card{background:var(--card);border-radius:24px;padding:18px 20px;box-shadow:0 6px 0 rgba(36,50,74,.08),0 10px 30px rgba(36,50,74,.08);margin-bottom:16px}
.hero{display:flex;align-items:center;gap:14px;justify-content:center;text-align:center;padding:8px 0 16px}
.hero p{margin:0;color:var(--soft);font-size:18px}
.char{width:96px;height:96px;flex:none}
.char.sm{width:64px;height:64px}
.bounce{animation:bounce .6s ease}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-18px)}60%{transform:translateY(0)}80%{transform:translateY(-6px)}}
.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{flex:1 1 auto;line-height:1.2;background:#f1f3f5;border-radius:16px;padding:10px 16px;font-size:19px;font-weight:600;display:flex;flex-direction:column;align-items:center;min-width:120px;border:3px solid transparent}
.chip small{font-weight:400;color:var(--soft);font-size:15px}
.chip.on{background:var(--hr);border-color:#f59f00}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.mode{width:100%;height:100%;align-items:flex-start;line-height:1.25;background:#f8f9fa;border-radius:20px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:4px;border:3px solid #e9ecef;font-size:19px;transition:transform .1s}
.mode:active{transform:scale(.97)}
.mode .ico{font-size:34px}
.mode small{color:var(--soft);font-size:15px;line-height:1.3}
.mode b,.mode small{display:block;width:100%}
.mode.learn{background:var(--mini-l);border-color:#b2f2bb}
.mode.knobel{background:#f3f0ff;border-color:#d0bfff}
.merk{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.merk .rule{flex:1;min-width:240px;border-radius:18px;padding:12px 16px;font-size:18px;display:flex;gap:10px;align-items:center}
.rule.down{background:var(--max-l)} .rule.up{background:var(--mini-l)}
.rule b{font-size:22px}

/* Top bar */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.back{background:#fff;border-radius:14px;padding:8px 14px;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.top .title{font-weight:600;font-size:20px;flex:1}
.dots{display:flex;gap:6px}
.dot{width:18px;height:18px;border-radius:50%;background:#dee2e6}
.dot.cur{background:#74c0fc;box-shadow:0 0 0 3px #d0ebff}
.dot.g{background:var(--ok)} .dot.y{background:#fab005} .dot.r{background:var(--bad)}

.speaker{display:flex;align-items:flex-end;gap:10px;margin-bottom:10px}
.bubble{background:#fff;border-radius:20px;padding:10px 16px;font-size:18px;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.06);max-width:600px}
.bubble:before{content:"";position:absolute;left:-10px;bottom:16px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.q{font-size:clamp(21px,3vw,26px);line-height:1.45;margin-bottom:10px}
.big{font-size:clamp(34px,6vw,52px);font-weight:700;letter-spacing:1px;text-align:center;margin:8px 0}
.hr{background:var(--hr);border-radius:8px;padding:0 3px;box-shadow:0 0 0 2px #f59f00 inset}
.hd{color:var(--hd);border-radius:50%;box-shadow:0 0 0 3px #ff8787;padding:0 4px;margin:0 1px}
.blank{display:inline-block;min-width:.9em;text-align:center;background:#f3f0ff;border:3px dashed var(--violet);border-radius:10px;color:var(--violet);margin:0 2px}

.tafel{border-collapse:collapse;margin:8px auto;font-size:26px;font-weight:600}
.tafel th,.tafel td{border:2px solid #ced4da;width:62px;height:50px;text-align:center}
.tafel th{background:#f1f3f5;font-size:18px}
.tafel .cr{background:var(--hr)}
.tafel td.cd{color:var(--hd);background:#fff5f5}
.tafel th.cd{background:#ffc9c9}

.nl{width:100%;max-width:640px;display:block;margin:6px auto}
.nlE{font-size:20px;font-weight:700;text-anchor:middle;fill:#24324a}
.nlM{font-size:15px;text-anchor:middle;fill:#e03131}
.nlS{font-size:14px;fill:#5d6b82}
.nlN{font-size:20px;font-weight:700;text-anchor:middle;fill:#7048e8}

.answer{margin-top:14px}
.display{font-size:40px;font-weight:700;text-align:center;background:#f8f9fa;border:3px solid #dee2e6;border-radius:18px;min-height:68px;padding:6px;margin:0 auto 12px;max-width:420px;letter-spacing:1px}
.display.empty{color:#adb5bd;font-weight:400;font-size:26px;line-height:52px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;margin:0 auto}
.pad button{font-size:30px;font-weight:600;background:#fff;border-radius:16px;height:64px;box-shadow:0 4px 0 #ced4da;border:2px solid #e9ecef}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #ced4da}
.pad .ok{background:var(--ok);color:#fff;box-shadow:0 4px 0 #237032;border-color:var(--ok)}
.pad .del{background:#fff4e6}
.choices{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.choice{font-size:24px;font-weight:600;background:#fff;border:3px solid #dee2e6;border-radius:18px;padding:14px 22px;min-width:150px;box-shadow:0 4px 0 #ced4da}
.choice:active{transform:translateY(3px)}
.choice.up{background:var(--mini-l);border-color:#8ce99a}
.choice.down{background:var(--max-l);border-color:#ffc078}
.choice.sel{border-color:var(--violet);background:#f3f0ff;box-shadow:0 4px 0 #b197fc}
.choice.right{border-color:var(--ok);background:var(--ok-l)}
.choice.wrong{border-color:var(--bad);background:var(--bad-l)}
.choice:disabled{cursor:default}
.check{display:block;margin:14px auto 0;font-size:22px;font-weight:600;background:var(--ok);color:#fff;border-radius:16px;padding:12px 30px;box-shadow:0 4px 0 #237032}
.helpbtn{background:#fff9db;border-radius:14px;padding:8px 14px;font-size:17px;margin-top:6px;border:2px solid #ffe066}
.fb{border-radius:18px;padding:14px 18px;margin-top:14px;font-size:19px;line-height:1.5}
.fb.ok{background:var(--ok-l);border:3px solid #8ce99a}
.fb.bad{background:var(--bad-l);border:3px solid #ffa8a8}
.fb.hint{background:#fff9db;border:3px solid #ffe066}
.fb .head{font-weight:700;font-size:22px}
.next{display:block;margin:16px auto 0;font-size:24px;font-weight:600;background:#339af0;color:#fff;border-radius:18px;padding:14px 40px;box-shadow:0 5px 0 #1c7ed6}
.duo{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.say{display:flex;align-items:center;gap:8px;background:#f8f9fa;border-radius:20px;padding:8px 14px;font-size:20px;flex:1;min-width:250px}
.say.m{background:var(--mini-l)} .say.x{background:var(--max-l)}
.cards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.ncard{width:58px;height:78px;border-radius:12px;background:#fff;border:3px solid var(--violet);font-size:38px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #b197fc;transform:rotate(var(--r))}
.mini-table{border-collapse:collapse;margin:8px auto;font-size:18px}
.mini-table td{padding:4px 12px;border-bottom:1px solid #e9ecef}
.mini-table tr.hit td{background:var(--ok-l);font-weight:600}

.digits{display:flex;justify-content:center;align-items:flex-end;gap:4px;flex-wrap:wrap;margin:10px 0}
.digits button{font-size:44px;font-weight:700;width:54px;height:70px;background:#fff;border:3px solid #dee2e6;border-radius:14px;box-shadow:0 4px 0 #ced4da}
.digits .sep{font-size:44px;font-weight:700;padding:0 2px}
.digits button.wrong{border-color:var(--bad);background:var(--bad-l)}
.step2{font-size:20px;text-align:center;margin:8px 0;font-weight:600}
.cells{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.cell{min-width:140px;background:#f8f9fa;border:3px solid #dee2e6;border-radius:16px;padding:6px 10px;display:flex;flex-direction:column;align-items:center}
.cell small{font-size:16px;color:var(--soft);font-weight:600}
.cell span{font-size:30px;font-weight:700;min-height:40px}
.cell.act{border-color:#339af0;background:#e7f5ff;box-shadow:0 0 0 3px #a5d8ff}
.cell.ok{border-color:var(--ok);background:var(--ok-l)}
.cell.bad{border-color:var(--bad);background:var(--bad-l)}
.rtab{border-collapse:collapse;margin:8px auto;font-size:20px}
.rtab td,.rtab th{border:2px solid #ced4da;padding:6px 12px;text-align:center}
.rtab th{background:#d0ebff}
.scene{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
.scene .bubble{font-size:17px}
.rule.about{background:#fff0f6}

/* Learn */
.learnbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:10px}
.learnbar input{font-family:inherit;font-size:22px;width:170px;padding:8px 12px;border-radius:14px;border:3px solid #dee2e6;text-align:center}
.btn{font-size:19px;font-weight:600;background:#fff;border-radius:14px;padding:10px 16px;border:3px solid #dee2e6;box-shadow:0 3px 0 #ced4da}
.btn.primary{background:#339af0;color:#fff;border-color:#339af0;box-shadow:0 3px 0 #1c7ed6}
.steps{list-style:none;padding:0;margin:10px 0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;font-size:20px;line-height:1.45;padding:10px 12px;border-radius:16px;margin-bottom:8px;background:#f8f9fa}
.steps li:before{content:counter(s);flex:none;width:34px;height:34px;border-radius:50%;background:#339af0;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.steps li.up{background:var(--mini-l)} .steps li.down{background:var(--max-l)}
.note{background:#fff9db;border-radius:14px;padding:10px 14px;font-size:18px;margin-top:8px}

.endbox{text-align:center}
.stars{font-size:64px;letter-spacing:8px;margin:10px 0}
.endbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
/* große Bildschirme / Tafel */
@media (min-width:1200px){
  .q{font-size:clamp(26px,2vw,36px)}
  .big{font-size:clamp(46px,4vw,70px)}
  .bubble{font-size:21px}
  .pad{max-width:480px}
  .pad button{height:clamp(64px,8vh,88px);font-size:36px}
  .display{max-width:480px;font-size:46px}
  .choice{font-size:28px;padding:18px 26px}
  .fb{font-size:21px}
  .tafel{font-size:32px}.tafel th,.tafel td{width:76px;height:60px}
  .steps li{font-size:23px}
  .modes{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
}
@media (max-width:560px){.char{width:70px;height:70px}.tafel th,.tafel td{width:46px;height:42px;font-size:20px}.pad button{height:56px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------- Grundlagen ---------- */
const POS=[10,100,1000,10000,100000];
const NAME={1:'Einer',10:'Zehner',100:'Hunderter',1000:'Tausender',10000:'Zehntausender',100000:'Hunderttausender'};
const SHORT={1:'E',10:'Z',100:'H',1000:'T',10000:'ZT',100000:'HT'};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const roundTo=(n,p)=>Math.floor((n+p/2)/p)*p;
const digitAt=(n,pos)=>Math.floor(n/pos)%10;
const setDigit=(n,pos,d)=>n-digitAt(n,pos)*pos+d*pos;
const dz=p=>NAME[p/10]+'ziffer';
const nb=p=>'Nachbar'+NAME[p].toLowerCase();

function makeNumber(p,special=true){
  const lens={10:[3,3,4],100:[4,4,5],1000:[4,5,6],10000:[5,6,6],100000:[6]}[p];
  for(let t=0;t<200;t++){
    const L=pick(lens); let n=rnd(10**(L-1),10**L-1);
    const r=Math.random();
    if(special&&r<0.18) n=setDigit(n,p/10,5);
    else if(special&&r<0.28){n=setDigit(n,p,9);n=setDigit(n,p/10,rnd(5,9));}
    if(n%p===0||n<p||n>=1000000) continue;
    return n;
  }
  return 3*p+7*(p/10);
}

/* Zahl mit markierten Ziffern */
function fmtHi(n,p,o={}){
  const {r=true,d=true,blank=false}=o; const s=String(n),L=s.length; let out='';
  for(let i=0;i<L;i++){
    const pos=10**(L-1-i);
    if(i>0&&(L-i)%3===0) out+='.';
    const ch=s[i];
    if(blank&&pos===p/10){out+='<span class="blank">?</span>';continue;}
    if(r&&pos===p) out+=`<span class="hr">${ch}</span>`;
    else if(d&&pos===p/10) out+=`<span class="hd">${ch}</span>`;
    else out+=ch;
  }
  return out;
}

function tafel(n,p,o={}){
  const {r=true,d=true,mask=false}=o; const cols=[100000,10000,1000,100,10,1]; const L=String(n).length;
  const cls=c=>(r&&c===p)?'cr':(d&&c===p/10)?'cd':'';
  let h='<table class="tafel" aria-label="Stellenwerttafel"><tr>'+cols.map(c=>`<th class="${cls(c)}">${SHORT[c]}</th>`).join('')+'</tr><tr>';
  h+=cols.map(c=>{let v=c<=10**(L-1)?digitAt(n,c):'';if(mask&&c>=p&&v!=='')v='?';return `<td class="${cls(c)}">${v}</td>`;}).join('');
  return h+'</tr></table>';
}

function numberLine(n,p,mark=true){
  const L=Math.floor(n/p)*p,U=L+p,M=L+p/2;
  const x=v=>40+(v-L)/p*520;
  let s=`<svg class="nl" viewBox="0 0 600 142" role="img" aria-label="Zahlenstrahl von ${fmt(L)} bis ${fmt(U)}">`;
  s+=`<line x1="40" y1="70" x2="300" y2="70" stroke="#d9a06b" stroke-width="9" stroke-linecap="round"/>`;
  s+=`<line x1="300" y1="70" x2="560" y2="70" stroke="#8fd16f" stroke-width="9" stroke-linecap="round"/>`;
  for(let i=0;i<=10;i++){const xx=40+i*52,big=i===0||i===10,mid=i===5;
    s+=`<line x1="${xx}" y1="${big?50:mid?48:60}" x2="${xx}" y2="${big?90:mid?92:80}" stroke="${mid?'#e03131':'#333'}" stroke-width="${big||mid?4:2}" stroke-linecap="round"/>`;}
  s+=`<text x="40" y="114" class="nlE">${fmt(L)}</text><text x="560" y="114" class="nlE">${fmt(U)}</text>`;
  s+=`<text x="300" y="112" class="nlM">Mitte: ${fmt(M)}</text>`;
  s+=`<text x="40" y="138" class="nlS" text-anchor="start">⬇ abrunden (Max)</text><text x="560" y="138" class="nlS" text-anchor="end">(Mini) aufrunden ⬆</text>`;
  if(mark){const xm=x(n),xl=Math.max(70,Math.min(530,xm));
    s+=`<polygon points="${xm-11},28 ${xm+11},28 ${xm},48" fill="#7048e8"/><text x="${xl}" y="22" class="nlN">${fmt(n)}</text>`;}
  return s+'</svg>';
}

/* ---------- Figuren ---------- */
const MINI_SVG=`<svg class="char" viewBox="0 0 100 100" aria-label="Mini, der Frosch"><ellipse cx="50" cy="94" rx="30" ry="4" fill="#000" opacity=".08"/><circle cx="31" cy="30" r="15" fill="#5cbf3f"/><circle cx="69" cy="30" r="15" fill="#5cbf3f"/><ellipse cx="50" cy="62" rx="40" ry="31" fill="#5cbf3f"/><ellipse cx="50" cy="76" rx="24" ry="13" fill="#b5e88f"/><circle cx="31" cy="30" r="10" fill="#fff"/><circle cx="69" cy="30" r="10" fill="#fff"/><circle cx="33" cy="32" r="5.5" fill="#222"/><circle cx="67" cy="32" r="5.5" fill="#222"/><circle cx="35" cy="29" r="1.8" fill="#fff"/><circle cx="69" cy="29" r="1.8" fill="#fff"/><path d="M30 60 Q50 76 70 60" stroke="#2b6e1f" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="22" cy="58" r="6" fill="#ff8fa3" opacity=".55"/><circle cx="78" cy="58" r="6" fill="#ff8fa3" opacity=".55"/><path d="M40 12 L45 3 L50 11 L55 3 L60 12 Z" fill="#fcc419"/></svg>`;
const MAX_SVG=`<svg class="char" viewBox="0 0 100 100" aria-label="Max, der Hund"><ellipse cx="50" cy="94" rx="30" ry="4" fill="#000" opacity=".08"/><ellipse cx="20" cy="48" rx="12" ry="25" fill="#7a4a24" transform="rotate(14 20 48)"/><ellipse cx="80" cy="48" rx="12" ry="25" fill="#7a4a24" transform="rotate(-14 80 48)"/><circle cx="50" cy="50" r="33" fill="#c98a4b"/><ellipse cx="64" cy="42" rx="11" ry="10" fill="#a8692f"/><ellipse cx="50" cy="66" rx="19" ry="15" fill="#f6e7d4"/><circle cx="38" cy="43" r="5" fill="#222"/><circle cx="63" cy="43" r="5" fill="#222"/><circle cx="39.5" cy="41.5" r="1.6" fill="#fff"/><circle cx="64.5" cy="41.5" r="1.6" fill="#fff"/><ellipse cx="50" cy="58" rx="7" ry="5" fill="#222"/><path d="M42 67 Q50 73 58 67" stroke="#222" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="50" cy="75" rx="5" ry="6" fill="#ff6b81"/><path d="M30 86 Q50 96 70 86" stroke="#e03131" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="50" cy="92" r="4" fill="#fcc419"/></svg>`;
const charSvg=(who,cls='')=>(who==='mini'?MINI_SVG:MAX_SVG).replace('class="char"',`class="char ${cls}"`);
const WHO={mini:'Mini',max:'Max'};

/* ---------- Erklärungen ---------- */
function explainRound(n,p){
  const d=digitAt(n,p/10),up=d>=5,r=roundTo(n,p);
  let s=`Rundungsstelle: <span class="hr">${NAME[p]}</span>. Rechts daneben steht beim ${NAME[p/10]} eine <span class="hd">${d}</span>. `;
  s+=up?`${d} ist 5 oder mehr → <b>aufrunden</b> ⬆ (Mini hüpft hoch).`:`${d} ist kleiner als 5 → <b>abrunden</b> ⬇ (Max buddelt runter).`;
  s+=`<div class="big" style="font-size:34px">${fmtHi(n,p)} ≈ ${fmt(r)}</div>`;
  if(up&&digitAt(n,p)===9) s+=`<div class="note">Achtung Übertrag: Die 9 beim ${NAME[p]} wird zur 10. Dadurch wird auch die Stelle links daneben um 1 größer.</div>`;
  return s;
}

function kGap(p){

function kWhich(p){
  let R=roundTo(makeNumber(p,false),p); if(R>=1000000)R-=p;
  const h=p/2;

  return {type:'Denkaufgabe',speaker:sp(),bubble:'Finde alle!',
    q:`Welche Zahlen ergeben auf <b>${NAME[p]}</b> gerundet genau <b>${fmt(R)}</b>? Tippe <b>alle</b> passenden an.`,

function kWhere(p){
  for(let t=0;t<300;t++){

    const target=avail.includes(p)?p:pick(avail);

      q:`${ctx[1]} waren es genau <b>${fmt(n)}</b> ${ctx[0]}.<br>In der Zeitung steht: „Rund <b>${fmt(r)}</b> ${ctx[0]}“.<br>Auf welche Stelle wurde gerundet?`,

/* Rechenstrich um eine runde Zahl R */
function rechenstrich(R,p,pts=[],range=false){
  const L=R-p,x=v=>40+(v-L)/(2*p)*520,h=p/2;
  let s=`<svg class="nl" viewBox="0 0 600 150" role="img" aria-label="Rechenstrich von ${fmt(L)} bis ${fmt(R+p)}">`;
  if(range)s+=`<rect x="${x(R-h)}" y="56" width="${x(R+h)-x(R-h)}" height="28" rx="8" fill="#8fd16f" opacity=".45"/><text x="${x(R)}" y="146" class="nlM" style="fill:#2f9e44;font-weight:600">alle diese Zahlen ≈ ${fmt(R)}</text>`;
  s+=`<line x1="40" y1="70" x2="560" y2="70" stroke="#495057" stroke-width="4" stroke-linecap="round"/>`;
  for(let i=0;i<=20;i++){const xx=40+i*26,big=i%10===0,mid=i%5===0;
    s+=`<line x1="${xx}" y1="${big?50:mid?56:62}" x2="${xx}" y2="${big?90:mid?84:78}" stroke="${!big&&mid?'#e03131':'#333'}" stroke-width="${big?4:mid?3:1.5}"/>`;}
  s+=`<text x="40" y="112" class="nlE">${fmt(L)}</text><text x="300" y="112" class="nlE">${fmt(R)}</text><text x="560" y="112" class="nlE">${fmt(R+p)}</text>`;
  if(range)s+=`<text x="170" y="104" class="nlM">${fmt(R-h)}</text><text x="430" y="104" class="nlM">${fmt(R+h)}</text>`;
  pts.forEach((v,k)=>{if(v<L||v>R+p)return;const xv=x(v),y=k%2?14:30;
    s+=`<line x1="${xv}" y1="${y+4}" x2="${xv}" y2="66" stroke="#7048e8" stroke-width="2"/><circle cx="${xv}" cy="70" r="7" fill="#7048e8"/><text x="${Math.max(60,Math.min(540,xv))}" y="${y}" class="nlN" style="font-size:17px">${fmt(v)}</text>`;});
  return s+'</svg>';
}

/* Alles passt immer auf den Bildschirm: Größe automatisch anpassen */
function fit(){
  if(!app)return;const de=document.documentElement,on=S.mode!==null;
  de.classList.toggle('fitmode',on);
  if(!on){app.style.transform='';app.style.width='';app.style.maxWidth='';app.style.margin='';return;}
  /* Übungsseiten: per transform skalieren (zuverlässig auch in Safari/iPad) */
  const vv=window.visualViewport,W=Math.round(vv?vv.width:window.innerWidth),H=Math.round(vv?vv.height:window.innerHeight);
  app.style.transform='';app.style.maxWidth='none';app.style.margin='0';
  const lay=s=>{const w=Math.min(W/s,1640);app.style.width=w+'px';return app.offsetHeight*s<=H;};
  let lo=.4,hi=1.7,best;
  if(lay(hi))best=hi;else{for(let k=0;k<12;k++){const m=(lo+hi)/2;if(lay(m))lo=m;else hi=m;}best=lo;}
  const w=Math.min(W/best,1640);app.style.width=w+'px';
  app.style.transform=`translateX(${Math.max(0,(W-w*best)/2)}px) scale(${best})`;
  window.scrollTo(0,0);
}
let fitT;const refit=()=>{clearTimeout(fitT);fitT=setTimeout(fit,80);};window.addEventListener('resize',refit);window.addEventListener('orientationchange',refit);if(window.visualViewport)window.visualViewport.addEventListener('resize',refit);

      else{const r=(el.requestFullscreen||el.webkitRequestFullscreen);if(r){const p=r.call(el);if(p&&p.catch)p.catch(()=>{});}}
    }catch(e){}}
  });
}

function updateCells(){
  const t=S.tasks[S.i],box=app.querySelector('#cells');if(!box)return;
  box.innerHTML=t.cells.map((c,k)=>`<button class="cell ${S.cellState[k]||''} ${k===S.active&&!S.locked?'act':''}" data-k="${k}"><small>${c.label}</small><span>${S.vals[k]?fmt(+S.vals[k]):''}</span></button>`).join('');
  box.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(S.locked||S.cellState[k]==='ok')return;S.active=k;updateCells();});
}
function cellKey(d){
  const k=S.active;
  if(d==='ok'){const e=S.vals.findIndex(v=>!v);if(e>=0){S.active=e;updateCells();return;}checkCells();return;}
  if(S.cellState[k]==='ok')return;
  if(S.cellState[k]==='bad')S.cellState[k]='';
  if(d==='del')S.vals[k]=S.vals[k].slice(0,-1);
  else if(d!==''&&S.vals[k].length<7)S.vals[k]=(S.vals[k]+d).replace(/^0+(?=\d)/,'');
  updateCells();
}
function checkCells(){
  const t=S.tasks[S.i],vals=S.vals.map(Number),seen=new Set();
  const st=t.cells.map((c,k)=>{let ok=c.check(vals[k]);if(t.distinct){if(seen.has(vals[k]))ok=false;seen.add(vals[k]);}return ok;});
  if(st.every(x=>x)){S.cellState=st.map(()=>'ok');updateCells();return finish(true);}
  S.tries++;S.cellState=st.map(x=>x?'ok':'bad');
  if(S.tries===1){
    react(false);S.vals=S.vals.map((v,k)=>st[k]?v:'');S.active=st.findIndex(x=>!x);updateCells();
    const dup=t.distinct&&new Set(vals).size<vals.length;
    app.querySelector('#fb').innerHTML=`<div class="fb hint"><div class="head">Fast! Die roten Felder stimmen noch nicht.</div>${dup?'Achtung: Die Zahlen müssen verschieden sein!<br>':''}${t.hint||''}</div>`;
    return;
  }
  updateCells();finish(false);
}
function padKey(d){
  if(S.locked)return;
  if(S.tasks[S.i].kind==='cells'){cellKey(d);return;}
  if(d==='del')S.input=S.input.slice(0,-1);
  else if(d==='ok'){if(S.input)checkInput();return;}
  else if(S.input.length<7)S.input=(S.input+d).replace(/^0+(?=\d)/,'');
  const disp=app.querySelector('#disp');if(!disp)return;
  disp.className='display '+(S.input?'':'empty');
  disp.textContent=S.input?fmt(+S.input):'Tippe deine Antwort';
}
document.addEventListener('keydown',e=>{
  if(!S.mode||S.mode==='learn'||!S.tasks[S.i])return;
  const t=S.tasks[S.i];
  if(S.locked&&e.key==='Enter'){const n=app.querySelector('#next');if(n)n.click();return;}
  const typing=t.kind==='input'||t.kind==='cells'||(t.kind==='mark'&&S.phase===1);
  if(!typing||e.target.tagName==='INPUT')return;
  if(/^\d$/.test(e.key))padKey(e.key);else if(e.key==='Backspace')padKey('del');else if(e.key==='Enter')padKey('ok');
});

const PRAISE={mini:['Quak-tastisch! 🐸','Super gehüpft!','Froschstark!','Genau richtig!'],max:['Wuff! Klasse! 🐶','Pfotenstark!','Spitze gebuddelt!','Volltreffer!']};
function react(ok){
  const t=S.tasks[S.i],w=app.querySelector('#who svg'),b=app.querySelector('#bub');
  if(w){w.classList.remove('bounce','shake');void w.getBoundingClientRect();w.classList.add(ok?'bounce':'shake');}
  if(b)b.textContent=ok?pick(PRAISE[t.speaker]):'Hmm … schau mal genau!';
}
function checkInput(){
  const t=S.tasks[S.i],v=+S.input;
  if(v===t.answer)return finish(true);
  S.tries++;
  if(S.tries===1){react(false);
    app.querySelector('#fb').innerHTML=`<div class="fb hint"><div class="head">Fast! Probier es nochmal.</div>${t.hint||''}</div>`;
    S.input='';padKey('');return;}
  finish(false);
}
function checkChoice(k){
  const t=S.tasks[S.i],btns=app.querySelectorAll('.choice');
  btns.forEach((b,i)=>{b.disabled=true;if(i===t.answer)b.classList.add('right');else if(i===k)b.classList.add('wrong');});
  finish(k===t.answer);
}
function checkMulti(){
  const t=S.tasks[S.i],want=new Set(t.answer);
  const ok=S.sel.size===want.size&&[...S.sel].every(v=>want.has(v));
  if(ok){markMulti();return finish(true);}
  S.tries++;
  if(S.tries===1){react(false);
    app.querySelector('#fb').innerHTML=`<div class="fb hint"><div class="head">Noch nicht ganz! ${S.sel.size<want.size?'Es fehlen noch welche.':'Prüfe deine Auswahl nochmal.'}</div>${t.hint||''}</div>`;return;}
  markMulti();finish(false);
}
function markMulti(){
  const t=S.tasks[S.i],want=new Set(t.answer);
  app.querySelectorAll('.choice').forEach((b,k)=>{const v=t.options[k].value;b.disabled=true;b.classList.remove('sel');
    if(want.has(v))b.classList.add('right');else if(S.sel.has(v))b.classList.add('wrong');});
}
function finish(ok){
  S.locked=true;const t=S.tasks[S.i];
  const first=S.tries===0&&!S.markErr;
  S.res[S.i]=ok?(first?'g':'y'):'r';
  react(ok);
  let sol=(t.kind==='input'||t.kind==='mark')?`Die Lösung ist <b>${fmt(t.answer)}</b>.<br>`:'';
  if(t.kind==='cells'&&t.cells.some(c=>c.sol!=null))sol=`Lösung: ${t.cells.map(c=>`${c.label}: <b>${fmt(c.sol)}</b>`).join(' · ')}<br>`;
  if(t.plot){const v=app.querySelector('#vis');if(v)v.innerHTML=t.plot(S.vals.filter(Boolean).map(Number));}
  if(t.kind==='cells')updateCells();
  app.querySelector('#fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><div class="head">${ok?(first?'Richtig! ⭐':'Richtig – im zweiten Versuch! 👍'):'Leider nicht richtig.'}</div>${ok?'':sol}${t.explain}</div>
  <button class="next" id="next">${S.i<S.tasks.length-1?'Weiter ▶':'Fertig 🏁'}</button>`;
  const dots=app.querySelectorAll('.dot');if(dots[S.i])dots[S.i].className='dot '+S.res[S.i];
  app.querySelector('#next').onclick=()=>{S.i++;if(S.i<S.tasks.length)startTask();else renderEnd();};
  app.querySelector('#acard').classList.add('done');
  fit();
}
function renderEnd(){
  const g=S.res.filter(x=>x==='g').length,y=S.res.filter(x=>x==='y').length,n=S.tasks.length;
  const pts=(2*g+y)/(2*n),st=pts>=.85?3:pts>=.6?2:1;
  const msg=st===3?'Wow! Ihr seid echte Rundungs-Profis!':st===2?'Gut gemacht! Noch ein bisschen üben, dann klappt alles.':'Guter Anfang! Schau dir den Erklärmodus nochmal an.';
  app.innerHTML=`<section class="card endbox">
    <div class="hero">${charSvg('mini','bounce')}${charSvg('max','bounce')}</div>
    <h1>Geschafft!</h1>
    <div class="stars">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div>
    <p style="font-size:22px"><b>${g+y} von ${n}</b> Aufgaben richtig${y?` (davon ${y} im zweiten Versuch)`:''}.</p>
    <p style="font-size:20px;color:var(--soft)">${msg}</p>
    <div class="endbtns"><button class="btn primary" id="again">🔁 Nochmal</button><button class="btn" id="menu">🏠 Menü</button>${st<3?'<button class="btn" id="learn">🧭 Erklären</button>':''}</div>
  </section>`;
  app.querySelector('#again').onclick=()=>startPlay(S.mode.id);
  app.querySelector('#menu').onclick=renderMenu;
  const l=app.querySelector('#learn');if(l)l.onclick=startLearn;
}

if(typeof document!=='undefined'&&document.getElementById('app')){app=document.getElementById('app');
  let raf=0;new MutationObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(fit);}).observe(app,{childList:true,subtree:true,attributes:true,attributeFilter:['hidden','class']});
  renderMenu();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);}
</script>
</body>
